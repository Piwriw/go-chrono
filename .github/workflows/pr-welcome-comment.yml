name: PR Welcome Comment
# PR 创建时自动添加说明评论（不重复）
# Auto add welcome comment when PR is created (no duplicates)

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const issueNumber = context.issue.number;
            const prAuthor = context.payload.pull_request.user.login;

            // 要添加的评论内容
            const welcomeComment = `🔊@${prAuthor} 🚀Thanks for your contribution🎉！

💡CodeRabbit(AI) will review your code first🔥！

Note

🚨The code review suggestions from CodeRabbit are to be used as a reference only, and the PR submitter can decide whether to make changes based on their own judgment. Ultimately, the project management personnel will conduct the final code review💥.`;

            // 获取 PR 的所有评论
            const comments = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber
            });

            // 检查是否已存在相同的评论
            const exists = comments.data.some(comment =>
              comment.body.includes('CodeRabbit(AI) will review your code first')
            );

            if (exists) {
              console.log('Welcome comment already exists, skipping...');
              return;
            }

            // 添加欢迎评论
            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber,
              body: welcomeComment
            });

            console.log('Welcome comment added successfully');